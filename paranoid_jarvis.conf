# Paranoid-Jarvis Configuration File
# Edit these values to customize behavior

[general]
# Directory for logs and images
output_dir = ~/ParanoidJarvisLogs
# Delete photos older than this many days (suspected-intrusion photos are kept)
retention_days = 30
# Camera index (0 is default/front)
camera_index = 0
# Event log file name (JSON Lines, one event per line)
log_file = events.jsonl
# Image file prefix
image_prefix = startup_image_
